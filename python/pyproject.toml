[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus-casadi"
version = "0.1.0"
description = "CasADi integration for DAEdalus: optimal control, MPC and moving horizon estimation on Modelica models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["casadi>=3.6", "numpy"]

[project.optional-dependencies]
examples = ["matplotlib"]
test = ["pytest"]

[tool.setuptools]
packages = ["daedalus_casadi"]

[tool.ruff]
line-length = 120
