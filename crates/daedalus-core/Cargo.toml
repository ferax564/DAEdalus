[package]
name = "daedalus-core"
description = "DAEdalus core: Modelica instantiation, symbolic backend, code generation and solvers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rumoca-phase-parse = { workspace = true }
rumoca-ir-ast = { workspace = true }
rumoca-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
indexmap = { workspace = true }
anyhow = { workspace = true }

[features]
# FMU export (`fmu::write_fmu`): adds the zip writer.
fmu = ["dep:zip"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bincode = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
