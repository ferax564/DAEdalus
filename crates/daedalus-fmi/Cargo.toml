[package]
name = "daedalus-fmi"
description = "FMI 2.0 and 3.0 (Model Exchange and Co-Simulation) runtime for FMUs exported by DAEdalus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# libdaedalus_fmi.so is the FMU binary: `daedalus fmu` copies it into the FMU as
# binaries/<platform>/<modelIdentifier>.so next to the serialized model.
crate-type = ["cdylib"]

[dependencies]
daedalus-core = { path = "../daedalus-core" }
bincode = "1.3"
