[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "daedalus"
description = "Python API of DAEdalus, a fast Modelica compiler and simulator"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest", "pandas"]

[project.urls]
Repository = "https://github.com/ferax564/DAEdalus"

[tool.maturin]
python-source = "python"
module-name = "daedalus._daedalus"

[tool.pytest.ini_options]
testpaths = ["tests"]
