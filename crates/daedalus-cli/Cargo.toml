[package]
name = "daedalus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[[bin]]
name = "daedalus"
path = "src/main.rs"
[dependencies]
daedalus-core = { path = "../daedalus-core", features = ["fmu", "jit"] }
# The workbench's Workspace, run natively by the local engine (`daedalus serve`).
daedalus-wasm = { path = "../daedalus-wasm" }
tiny_http = "0.12"
getrandom = "0.3"
anyhow = { workspace = true }
rumoca-ir-ast = { workspace = true }
rumoca-core = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
