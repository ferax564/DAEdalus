name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests and example library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --workspace
      - name: Build CLI
        run: cargo build --release -p daedalus-cli
      - name: Simulate every Daedalus example
        run: ./target/release/daedalus test-library library/Daedalus -m Daedalus
      - name: Scalability smoke test (2000-mass chain)
        run: |
          python3 tools/gen_chain.py 2000 > /tmp/chain.mo
          ./target/release/daedalus simulate library/Daedalus /tmp/chain.mo -m Chain --stop 0.2 -o /tmp/chain.mat

  web:
    name: WebAssembly and workbench build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build WebAssembly module
        working-directory: web
        run: npm run wasm
      - name: Typecheck and bundle
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: workbench
          path: web/dist
