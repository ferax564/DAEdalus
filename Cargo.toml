[workspace]
resolver = "2"
members = [
    "crates/daedalus-core",
    "crates/daedalus-cli",
    "crates/daedalus-wasm",
    "crates/daedalus-fmi",
]
# The Python extension is built with maturin (crates/daedalus-py/pyproject.toml).
exclude = ["crates/daedalus-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ferax564/DAEdalus"

[workspace.dependencies]
# Rumoca frontend (Apache-2.0): parser + AST. Pinned to an exact upstream commit.
rumoca-phase-parse = { git = "https://github.com/CogniPilot/rumoca", rev = "ad00214a2294682bd3313f8d74d4afd372143fac" }
rumoca-ir-ast = { git = "https://github.com/CogniPilot/rumoca", rev = "ad00214a2294682bd3313f8d74d4afd372143fac" }
rumoca-core = { git = "https://github.com/CogniPilot/rumoca", rev = "ad00214a2294682bd3313f8d74d4afd372143fac" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rustc-hash = "2"
indexmap = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = 3
lto = "fat"
